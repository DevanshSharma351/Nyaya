[project]
name = "nyaya"
version = "0.1.0"
description = "Nyaya - Agentic requirements engineering, compliance mapping and SDLC selection for regulated financial software"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- web / api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # --- persistence ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "greenlet>=3.1",  # required by SQLAlchemy's async bridge; not pulled in automatically on arm64
    # --- agent orchestration ---
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.2",
    # --- llm providers (all optional at runtime, selected via config) ---
    "google-genai>=0.3",
    "groq>=0.13",
    "anthropic>=0.40",
    # --- retrieval / nlp ---
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "rank-bm25>=0.2.2",
    "spacy>=3.8",
    # --- document ingestion ---
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    # --- privacy ---
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # --- rules / mcda / eval ---
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # --- observability ---
    "langfuse>=2.53",
    "structlog>=24.4",
    # --- misc ---
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "ipython>=8.29",
]

[project.scripts]
nyaya = "nyaya.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyaya"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # `Depends(...)` in a parameter default is FastAPI's documented idiom; the
    # call is evaluated once at import and is not a mutable shared default.
    "B008",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped loop. Both the database engine and the cached LLM providers
# hold connections bound to the loop that created them; a per-test loop closes
# those out from under the session-scoped fixtures.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
