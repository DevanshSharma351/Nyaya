  <text x="55" y="510" fill="#d9480f" font-size="15" text-anchor="start" font-weight="600">
    <tspan x="55" dy="0">EXTRACTION &amp; REPAIR ENGINE — bounded to 2 attempts</tspan>
  </text>
  <text x="55" y="537.5" fill="#212529" font-size="12.5" text-anchor="start" font-weight="600">
    <tspan x="55" dy="0">Deterministic Quality Linters (offline, zero-cost):</tspan>
    <tspan x="55" dy="16.25px"> • ears.analyse: event/state/ubiquitous arity &amp; compound splitting</tspan>
    <tspan x="55" dy="16.25px"> • lexicon.scan: weak-word lexicon (rapidly, robust, seamless, etc.)</tspan>
    <tspan x="55" dy="16.25px"> • quantities: flags numbers not in source text (anti-hallucination)</tspan>
    <tspan x="55" dy="16.25px"> • provenance: checks quoted_source appears verbatim in input text</tspan>
    <tspan x="55" dy="16.25px"></tspan>
    <tspan x="55" dy="16.25px">Bounded Repair Loop:</tspan>
    <tspan x="55" dy="16.25px"> • feeds back line-level defect &amp; remedy to model; max 2 rounds</tspan>
    <tspan x="55" dy="16.25px"> • safe degraded fallback: preserves defects rather than inventing</tspan>
  </text>
  <rect x="40" y="730" width="595" height="215" rx="12" fill="#fff3bf" stroke="#f59f00" stroke-width="2"  />
  <text x="55" y="755" fill="#d9480f" font-size="15" text-anchor="start" font-weight="600">
    <tspan x="55" dy="0">MCDA SDLC DECISION ENGINE — AHP &amp; TOPSIS</tspan>
  </text>
  <text x="55" y="782.5" fill="#212529" font-size="12.5" text-anchor="start" font-weight="600">
    <tspan x="55" dy="0">AHP (Analytic Hierarchy Process):</tspan>
    <tspan x="55" dy="16.25px"> • pairwise comparison matrix for team, governance, criticality</tspan>
    <tspan x="55" dy="16.25px"> • Consistency Ratio (CR &lt; 0.1): validates mathematical rigor</tspan>
    <tspan x="55" dy="16.25px"></tspan>
    <tspan x="55" dy="16.25px">TOPSIS Multi-Criteria Decision Analysis:</tspan>
    <tspan x="55" dy="16.25px"> • ranks Waterfall, Spiral, V-Model, Agile against ideal solution</tspan>
    <tspan x="55" dy="16.25px"> • close-call detection: flags when top-2 models within 3% margin</tspan>
    <tspan x="55" dy="16.25px"> • derived factors: volatility, concurrency, security, team size</tspan>
  </text>
  <rect x="660" y="485" width="600" height="275" rx="12" fill="#e6fcf5" stroke="#0c8599" stroke-width="2"  />
  <text x="675" y="510" fill="#087f5b" font-size="15" text-anchor="start" font-weight="600">
    <tspan x="675" dy="0">ADVERSARIAL COMPLIANCE GROUNDING — 3-point verification</tspan>
  </text>
  <text x="675" y="537.5" fill="#212529" font-size="12.5" text-anchor="start" font-weight="600">
    <tspan x="675" dy="0">Hybrid Retrieval Engine:</tspan>
    <tspan x="675" dy="16.25px"> • dense BGE-small-en (512d) + BM25 keyword + cross-encoder rerank</tspan>
    <tspan x="675" dy="16.25px"></tspan>
    <tspan x="675" dy="16.25px">Deterministic 3-Point Grounding Check:</tspan>
    <tspan x="675" dy="16.25px"> 1. Clause exists in versioned DB (no hallucinated citations)</tspan>
    <tspan x="675" dy="16.25px"> 2. Quoted text matches clause substring verbatim</tspan>
    <tspan x="675" dy="16.25px"> 3. DeBERTa-v3-small-mnli evaluates semantic entailment</tspan>
    <tspan x="675" dy="16.25px"></tspan>
    <tspan x="675" dy="16.25px">Confidence Fusion &amp; Tier Partitioning:</tspan>
    <tspan x="675" dy="16.25px"> • score = f(retrieval, NLI, quote) in [0, 1]</tspan>
    <tspan x="675" dy="16.25px"> • Tier 1: auto-confirmed (statutory obligation satisfied)</tspan>
    <tspan x="675" dy="16.25px"> • Tier 2: needs review -&gt; routed to Gate 2 with reasoning</tspan>
    <tspan x="675" dy="16.25px"> • Regulatory Judge Agent: second opinion on review band (advisory)</tspan>
  </text>
  <rect x="660" y="775" width="600" height="170" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"  />
  <text x="675" y="800" fill="#2b8a3e" font-size="15" text-anchor="start" font-weight="600">
    <tspan x="675" dy="0">COMPLIANCE COVERAGE ENGINE — YAML Rule DSL</tspan>
  </text>
  <text x="675" y="827.5" fill="#212529" font-size="12.5" text-anchor="start" font-weight="600">
    <tspan x="675" dy="0">Declarative Regulatory Rule Packs (YAML):</tspan>
    <tspan x="675" dy="16.25px"> • evaluates requirement facts against regulations (e.g. ekyc-in.yaml)</tspan>
    <tspan x="675" dy="16.25px"> • checks statutory obligations: data retention, encryption, audit logs</tspan>
    <tspan x="675" dy="16.25px"></tspan>
    <tspan x="675" dy="16.25px">Blocking Gap Identification &amp; Gate 3:</tspan>
    <tspan x="675" dy="16.25px"> • flags uncovered mandatory controls before system build</tspan>
    <tspan x="675" dy="16.25px"> • Human Gate 3 requires compliance officer sign-off or gap waiver</tspan>
