  <rect x="40" y="1110" width="1220" height="60" rx="12" fill="#ffffff" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="55" y="1132" fill="#495057" font-size="12" text-anchor="start" font-weight="600">
    <tspan x="55" dy="0">Architecture Invariants: A state graph, not an autonomous swarm. In regulated compliance, agent-to-agent negotiation is a liability.</tspan>
    <tspan x="55" dy="15.600000000000001px">Every transition is checkpointed, every citation is verified against versioned text, and no run proceeds past a human gate without authorized clearance.</tspan>
